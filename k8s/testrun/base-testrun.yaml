# Base TestRun template — use as reference for creating per-scenario TestRuns.
# The run-distributed.sh script generates these dynamically.
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: SCENARIO-NAME
  namespace: k6-perf-testing
  labels:
    scenario: SCENARIO-ID
    category: baseline
    priority: p0
    profile: load
spec:
  parallelism: 4
  script:
    configMap:
      name: k6-scenario-SCENARIO-ID
      file: SCENARIO-FILE.js
  arguments: --out json=/tmp/results.json
  runner:
    image: grafana/k6:latest
    env:
      - name: ENV
        value: "staging"
      - name: PROFILE
        value: "load"
      - name: BASE_URL
        value: "http://client-oppy-configuration.default.svc:6010"
      - name: TENANT_ID
        value: "12345"
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    # Spread runners across nodes for realistic network patterns
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - k6
              topologyKey: kubernetes.io/hostname
