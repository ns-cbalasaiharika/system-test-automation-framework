# Toxiproxy deployment for fault injection scenarios (SF-*)
# Intercepts traffic between service and dependencies (Redis, DB, Kafka)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: k6-perf-testing
  labels:
    app: toxiproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:latest
          ports:
            - containerPort: 8474
              name: api
            - containerPort: 6380
              name: redis-proxy
            - containerPort: 3308
              name: db-proxy
            - containerPort: 9093
              name: kafka-proxy
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: k6-perf-testing
spec:
  selector:
    app: toxiproxy
  ports:
    - name: api
      port: 8474
      targetPort: 8474
    - name: redis-proxy
      port: 6380
      targetPort: 6380
    - name: db-proxy
      port: 3308
      targetPort: 3308
    - name: kafka-proxy
      port: 9093
      targetPort: 9093
