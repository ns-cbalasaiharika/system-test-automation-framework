# Stress pod for noisy neighbor scenarios (NN-*)
# Deploy on the same node as service pods to simulate resource contention
apiVersion: v1
kind: Pod
metadata:
  name: stress-neighbor
  namespace: k6-perf-testing
  labels:
    app: stress-neighbor
    purpose: noisy-neighbor-testing
spec:
  containers:
    - name: stress
      image: progrium/stress:latest
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "4000m"
          memory: "2Gi"
  # Schedule on same node as service pod for resource contention
  # Uncomment and set nodeName after identifying target node:
  # nodeName: <target-node>
