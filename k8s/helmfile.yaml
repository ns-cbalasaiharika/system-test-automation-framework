# =============================================================================
# Rancher/Production Cluster Helmfile
# Deploys the full k6 performance testing stack with metrics collection
#
# Components:
#   - k6-operator: Manages TestRun CRDs for distributed k6 tests
#   - InfluxDB v2: Time-series database for k6 metrics
#   - Grafana: Dashboards for test result visualization
#
# Usage:
#   helmfile sync                    # Deploy all components
#   helmfile sync -l app=k6-operator # Deploy only k6-operator
#   helmfile destroy                 # Remove all components
#
# Prerequisites:
#   - kubectl configured to target Rancher cluster
#   - helmfile installed (brew install helmfile)
# =============================================================================

repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: influxdata
    url: https://helm.influxdata.com

helmDefaults:
  wait: true
  timeout: 300
  createNamespace: true

releases:
  # ═══════════════════════════════════════════════════════════════════════════
  # K6 OPERATOR - Manages distributed k6 test runs
  # ═══════════════════════════════════════════════════════════════════════════
  - name: k6-operator
    namespace: k6-operator-system
    chart: grafana/k6-operator
    labels:
      app: k6-operator

  # ═══════════════════════════════════════════════════════════════════════════
  # INFLUXDB V2 - Stores k6 test metrics
  # ═══════════════════════════════════════════════════════════════════════════
  - name: influxdb
    namespace: k6-perf-testing
    chart: influxdata/influxdb2
    labels:
      app: influxdb
    set:
      - name: persistence.enabled
        value: "true"
      - name: persistence.size
        value: "10Gi"
      - name: adminUser.organization
        value: "netskope"
      - name: adminUser.bucket
        value: "k6-metrics"
      - name: adminUser.user
        value: "admin"
      - name: adminUser.password
        value: "admin-password"  # Change in production!
      - name: adminUser.token
        value: "k6-influxdb-token"  # Change in production!

  # ═══════════════════════════════════════════════════════════════════════════
  # GRAFANA - Dashboards for k6 test results
  # ═══════════════════════════════════════════════════════════════════════════
  - name: grafana
    namespace: k6-perf-testing
    chart: grafana/grafana
    labels:
      app: grafana
    set:
      - name: adminUser
        value: "admin"
      - name: adminPassword
        value: "admin-password"  # Change in production!
      - name: persistence.enabled
        value: "true"
      - name: persistence.size
        value: "5Gi"
      # InfluxDB datasource
      - name: datasources."datasources\.yaml".apiVersion
        value: "1"
      - name: datasources."datasources\.yaml".datasources[0].name
        value: "InfluxDB"
      - name: datasources."datasources\.yaml".datasources[0].type
        value: "influxdb"
      - name: datasources."datasources\.yaml".datasources[0].url
        value: "http://influxdb-influxdb2.k6-perf-testing.svc:80"
      - name: datasources."datasources\.yaml".datasources[0].access
        value: "proxy"
      - name: datasources."datasources\.yaml".datasources[0].jsonData.version
        value: "Flux"
      - name: datasources."datasources\.yaml".datasources[0].jsonData.organization
        value: "netskope"
      - name: datasources."datasources\.yaml".datasources[0].jsonData.defaultBucket
        value: "k6-metrics"
      - name: datasources."datasources\.yaml".datasources[0].secureJsonData.token
        value: "k6-influxdb-token"
