# =============================================================================
# MINIKUBE-CLUSTER ENVIRONMENT
# For k6 tests running INSIDE the Kubernetes cluster (via k6-operator)
# Services accessed via Kubernetes DNS
# =============================================================================

name: minikube-cluster
description: k6 running inside Minikube cluster via k6-operator

# Kubernetes service DNS names
services:
  client-oppy-configuration: http://client-oppy-configuration.client-oppy.svc.cluster.local
  client-oppy-steering: http://client-oppy-steering.client-oppy.svc.cluster.local
  client-oppy-orchestrator: http://client-oppy-orchestrator.client-oppy.svc.cluster.local

defaults:
  tenantId: "12345"
  
  headers:
    Content-Type: application/json
    x-netskope-tenantid: "12345"
    x-netskope-user-email: k6-system-test@netskope.com
  
  thinkTime:
    minMs: 100
    maxMs: 300
